<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7eee1">
  <meta name="description" content="The wedding celebration of Afreen and Irfan — 2 January 2027.">
  <title>Afreen &amp; Irfan — Wedding Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="invitation-locked">
  <header class="site-top">
    <a class="brand" href="#opening" aria-label="Afreen and Irfan, back to beginning">A <span>&amp;</span> I</a>
    <nav aria-label="Invitation sections">
      <a href="#welcome">Welcome</a>
      <a href="#invitation">Invitation</a>
      <a href="#date">Date</a>
      <a href="#nikah">Nikah</a>
      <a href="#reception">Reception</a>
    </nav>
  </header>

  <main>
    <section class="art-section opening" id="opening" aria-label="Opening invitation doors">
      <div class="door-stage" id="doorStage">
        <img class="welcome-underlay" src="assets/02-welcome.png" alt="Afreen and Irfan are saying Qubool Hai">
        <div class="door-panel door-left" aria-hidden="true"></div>
        <div class="door-panel door-right" aria-hidden="true"></div>
        <button class="opening-action" id="openDoors" type="button" aria-label="Tap the A and I wax seal to open the invitation"></button>
      </div>
    </section>

    <section class="art-section" id="invitation" aria-label="Wedding invitation">
      <img src="assets/03-invitation.png" alt="Wedding invitation from Mr. Mushtaq Alimohammed Kasmani and Mrs. Jabin Mushtaq Kasmani for the Nikah and wedding reception of Afreen with Irfan">
    </section>

    <section class="art-section date-section" id="date" aria-label="The Day Our Forever Begins">
      <img src="assets/04-date-reveal.png" alt="The Day Our Forever Begins. Tap to Reveal. Our Wedding Date. An ornate ivory envelope with a navy wax seal.">
      <button class="image-action date-action" id="revealDate" type="button" aria-label="Tap the envelope to reveal the wedding date"></button>
      <div class="date-card" id="dateCard" hidden aria-live="polite">
        <span>OUR WEDDING DATE</span>
        <strong>2nd January 2027</strong>
      </div>
    </section>

    <section class="art-section" id="nikah" aria-label="Nikah ceremony">
      <img src="assets/05-nikah.png" alt="The Nikah Ceremony, 2nd January 2027 at 11:00 AM, Shakrullah Shah Baba Dargah, J.P. Road, Versova">
      <a class="image-action nikah-map" href="https://maps.app.goo.gl/QtTaWeRokXrGf7X38?g_st=ic" target="_blank" rel="noopener" aria-label="Open Nikah location in Google Maps"></a>
    </section>

    <section class="art-section" id="reception" aria-label="Reception and dinner">
      <img src="assets/06-reception.png" alt="Reception and Dinner, 2nd January 2027 at 8:30 PM onwards, FM Majestic Banquets, Golden Tobacco House, S.V. Road, Vile Parle West">
      <a class="image-action reception-map" href="https://maps.app.goo.gl/9Y9bztbEMMvAgQxZA?g_st=ic" target="_blank" rel="noopener" aria-label="Open reception location in Google Maps"></a>
    </section>

    <section class="art-section" id="closing" aria-label="The Kasmani family welcomes you">
      <img src="assets/07-closing.png" alt="Every beautiful celebration becomes more meaningful when shared with the people we love. The Kasmani family welcomes you.">
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
